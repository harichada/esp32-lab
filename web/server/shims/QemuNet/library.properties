sentence=Network shim for running ESP32 Arduino sketches under QEMU (Wi-Fi is not emulated).
paragraph=Replaces WiFi.h / HTTPClient.h / WiFiUdp.h. Requests are framed on UART0 as "@NET {json}" lines and answered by the simulator's mock devices ("@R code" / "@U ip port hex").
