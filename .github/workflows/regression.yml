name: Core regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:core

  backend:
    name: Health and account contracts (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIM_PREWARM: '0'
      SIM_NETSTACK_WARM: '0'
      AUTH_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: web/tests/requirements.txt
      - run: python -m pip install -r web/tests/requirements.txt
      - working-directory: web
        env:
          SIM_PROJECT_DIR: ${{ runner.temp }}/regression-projects
          SIM_BUILD_DIR: ${{ runner.temp }}/regression-builds
        run: python -m unittest tests.health_route_test tests.auth_test -v

  browser:
    name: Browser persistence (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke -- --timeout=60000
